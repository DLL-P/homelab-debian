# Dashboard e observabilidade: Homepage, Uptime Kuma, Scrutiny, Diun.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma:/app/data
    restart: unless-stopped

  scrutiny:
    image: ghcr.io/analogj/scrutiny:latest
    container_name: scrutiny
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - "${SCRUTINY_DISK_1}:${SCRUTINY_DISK_1}"
      - "${SCRUTINY_DISK_2}:${SCRUTINY_DISK_2}"
      - "${SCRUTINY_DISK_3}:${SCRUTINY_DISK_3}"
    ports:
      - "8091:8080"
    volumes:
      - ./scrutiny:/opt/scrutiny/config
    restart: unless-stopped

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - ./diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - DIUN_WATCH_SCHEDULE=0 8 * * *
      - DIUN_PROVIDERS_DOCKER=true
      # As variáveis de notificação do Diun são específicas por provedor
      # (ex: DIUN_NOTIF_NTFY_ENDPOINT/DIUN_NOTIF_NTFY_TOPIC para ntfy,
      # DIUN_NOTIF_DISCORD_WEBHOOKURL para Discord). Consulte a documentação
      # oficial do Diun para o provedor escolhido e ajuste aqui — o valor em
      # DIUN_NOTIF_URL (.env) é só um placeholder de referência.
    restart: unless-stopped

networks:
  default:
    name: proxy-network
    external: true
